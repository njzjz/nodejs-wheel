name: Build and upload to PyPI

on:
  push:
    branches:
      - master
      - current
    tags:
      - v*
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and finish publishing
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve_source:
    name: Resolve and validate source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate release tag format
        if: github.event_name == 'workflow_dispatch'
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import os
          import re

          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?", os.environ["RELEASE_TAG"]):
              raise SystemExit("Expected an existing vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCHrcN tag")
      - uses: actions/checkout@v6
        with:
          # Explicit tags prevent a same-named branch from selecting other sources.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Pin source and check the bundled Node.js version
        id: source
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import os
          import pathlib
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          if tag:
              node_version = pathlib.Path(".nvmrc").read_text().strip()
              if tag.removeprefix("v").split("rc", 1)[0] != node_version:
                  raise SystemExit(f"Release tag {tag} does not match Node.js {node_version}")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={commit}\n")
  build_wheels:
    needs: resolve_source
    name: Build wheels for cp${{ matrix.python }}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-64
          - os: ubuntu-latest
            python: 311
            platform_id: manylinux_x86_64
          - os: ubuntu-latest
            python: 311
            platform_id: musllinux_x86_64
          # macos-x86-64
          - os: macos-15-intel
            python: 311
            platform_id: macosx_x86_64
          # macos-arm64
          - os: macos-15
            python: 311
            platform_id: macosx_arm64
          # windows-64
          - os: windows-latest
            python: 311
            platform_id: win_amd64
          # linux-aarch64
          - os: ubuntu-24.04-arm
            python: 311
            platform_id: manylinux_aarch64
          - os: ubuntu-24.04-arm
            python: 311
            platform_id: musllinux_aarch64
          # windows-arm64
          - os: windows-11-arm
            python: 311
            platform_id: win_arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_source.outputs.commit }}
          # Version providers need the release tags even with a pinned commit.
          fetch-depth: 0
      - uses: ilammy/setup-nasm@v1
        if: matrix.platform_id == 'win_amd64' || matrix.platform_id == 'win_arm64'
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS: all
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-cp${{ matrix.python }}-${{ matrix.platform_id }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
  build_sdist:
    needs: resolve_source
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_source.outputs.commit }}
          # Both setuptools-scm and hatch-vcs derive the version from tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.15'
      - run: python -m pip install build
      - name: Build sdist
        run: pipx run build --sdist
      - name: Build sdist for cmd
        run: cd cmd && pipx run build
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-cmd
          path: cmd/dist/*
  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v'))
    permissions:
        # IMPORTANT: this permission is mandatory for trusted publishing
        id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A historical upload can have succeeded for only part of the release.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
  pass:
    name: Pass testing build wheels
    needs: [resolve_source, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
